[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "borehole-log-gis"
version = "0.1.0"
description = "Check borehole intervals and turn them into logs and QGIS-ready data"
requires-python = ">=3.11"
dependencies = ["fiona>=1.9,<2", "pyproj>=3.6,<4", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
water = [
    "h5py>=3.12,<4",
    "pandas>=2.2,<3",
    "pywin32>=306 ; sys_platform == 'win32'",
    "scipy>=1.14,<2",
    "setuptools>=70,<81",
    "six>=1.16,<2",
    "wntr==1.4.0",
]

[project.scripts]
borehole-gis = "borehole_gis.cli:main"
site-water = "borehole_gis.water_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["projects"]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["src/borehole_gis"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
