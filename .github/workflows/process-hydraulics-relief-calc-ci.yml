name: process-hydraulics-relief-calc / CI
on:
  push:
    branches:
    - main
    paths:
    - projects/process-hydraulics-relief-calc/**
    - .github/workflows/process-hydraulics-relief-calc-ci.yml
  pull_request:
    paths:
    - projects/process-hydraulics-relief-calc/**
    - .github/workflows/process-hydraulics-relief-calc-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.10'
        - '3.12'
        - '3.14'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -e '.[dev]'
    - run: ruff check .
    - run: ruff format --check .
    - run: python -m pytest -q
    - run: python -m build
    - name: Check generated note
      run: 'hydraulics-calc examples/transfer.json --output /tmp/calculation-note.md

        diff -u docs/calculation-note.md /tmp/calculation-note.md

        '
    - name: Exercise built wheel outside source tree
      run: 'python -m venv /tmp/wheel-check

        /tmp/wheel-check/bin/python -m pip install dist/*.whl

        cd /tmp

        /tmp/wheel-check/bin/hydraulics-calc "$GITHUB_WORKSPACE/examples/transfer.json" --output wheel-note.md

        diff -u "$GITHUB_WORKSPACE/docs/calculation-note.md" wheel-note.md

        '
defaults:
  run:
    working-directory: projects/process-hydraulics-relief-calc
