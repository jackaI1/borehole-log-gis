name: Borehole checks
on:
  push:
    branches: [main, 'skills/**']
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
  qgis:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Generate checked public-data exports
        run: |
          uv run borehole-gis samples/bc_boreholes.csv --format bc-csv --depth-unit m --out build/bc
          uv run borehole-gis samples/bgs_bh01.ags --format ags --crs EPSG:27700 --output-crs EPSG:27700 --out build/ags
      - name: Install QGIS Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-qgis python3-pil
      - name: Render and reopen the actual QGIS project
        run: |
          /usr/bin/python3 scripts/qgis_map.py build/bc
          /usr/bin/python3 scripts/verify_qgis.py build/bc
          /usr/bin/python3 scripts/qgis_map.py build/ags
      - uses: actions/upload-artifact@v4
        with:
          name: public-borehole-example
          path: build/
