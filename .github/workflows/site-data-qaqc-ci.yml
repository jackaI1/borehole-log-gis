name: site-data-qaqc / QA and portable exports
on:
  push:
    branches:
    - main
    paths:
    - projects/site-data-qaqc/**
    - .github/workflows/site-data-qaqc-ci.yml
  pull_request:
    paths:
    - projects/site-data-qaqc/**
    - .github/workflows/site-data-qaqc-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
        - '3.11'
        - '3.12'
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.9.9
        working-directory: projects/site-data-qaqc
    - run: uv python install ${{ matrix.python }}
    - run: uv sync --frozen --python ${{ matrix.python }}
    - run: uv run --frozen ruff check .
    - run: uv run --frozen ruff format --check .
    - run: uv run --frozen pytest -q
    - name: Build and try the installed wheel outside the checkout
      shell: bash
      run: 'uv build

        uv venv "$RUNNER_TEMP/site-wheel" --python ${{ matrix.python }}

        uv pip install --python "$RUNNER_TEMP/site-wheel/bin/python" dist/*.whl

        cd "$RUNNER_TEMP"

        "$RUNNER_TEMP/site-wheel/bin/site-qaqc" "$GITHUB_WORKSPACE"/projects/site-data-qaqc/data/synthetic/*.csv --out "$RUNNER_TEMP/site-demo"

        "$RUNNER_TEMP/site-wheel/bin/python" -c ''import json,os; from pathlib import Path; s=json.loads((Path(os.environ["RUNNER_TEMP"])/"site-demo/summary.json").read_text());
        assert s["counts"]["results"]==17 and s["counts"]["rejected"]==6 and s["screening"]["exceeds"]==7''

        '
    - uses: actions/upload-artifact@v4
      with:
        name: synthetic-site-reports-python-${{ matrix.python }}
        path: ${{ runner.temp }}/site-demo
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/site-data-qaqc
