[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "process-hydraulics-relief-calc"
version = "0.1.0"
description = "Auditable liquid piping and preliminary API 520 relief-area calculations"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Jack Lai"}]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
hydraulics-calc = "process_hydraulics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/process_hydraulics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
