[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "site-data-qaqc"
version = "0.1.0"
description = "Traceable groundwater and soil table cleanup, screening and GIS exports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["geopandas>=1.0,<2", "matplotlib>=3.9,<4", "pandas>=2.2,<3", "pyogrio>=0.9,<1", "pyproj>=3.6,<4"]

[project.scripts]
site-qaqc = "site_data_qaqc.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
